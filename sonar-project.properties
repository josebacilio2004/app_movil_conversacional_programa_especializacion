# =====================================================================
# CONFIGURACIÓN DE AUDITORÍA DE CÓDIGO LIMPIO - SONARQUBE
# Tesis: App Móvil con Chatbot de Recomendación - Universidad Continental
# Estándares: ISO/IEC 25010, ISO 9001, ISO 29119, ISO 27001
# =====================================================================

sonar.projectKey=app_movil_conversacional_especializacion
sonar.projectName=App Móvil Conversacional Cori - Horizonte UC
sonar.projectVersion=3.0.0

# Fuentes analizadas
sonar.sources=lib,functions,horizonte_web_system/backend
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/node_modules/**,**/build/**,**/.dart_tool/**,**/web/**

# Pruebas y Cobertura
sonar.tests=test
sonar.dart.coverage.reportPaths=coverage/lcov.info

# Codificación
sonar.sourceEncoding=UTF-8

# Reglas de Calidad y Umbrales ISO 25010
sonar.qualitygate.wait=true
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/mock_*.dart
